<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverScript | Digital Legacy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // ВСТАВЬТЕ СВОЙ КОНФИГ СЮДА:
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_PROJECT.firebaseapp.com",
            projectId: "ВАШ_PROJECT_ID",
            storageBucket: "ВАШ_PROJECT.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            auth: getAuth(app),
            db: getFirestore(app),
            storage: getStorage(app),
            methods: { doc, setDoc, getDoc, collection, addDoc, onSnapshot, deleteDoc, ref, uploadBytes, getDownloadURL, deleteObject, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #020617; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .file-card { transition: all 0.2s; border: 1px solid rgba(255, 255, 255, 0.05); position: relative; }
        .file-card:hover { background: rgba(255, 255, 255, 0.07); }
        .loader-ring { border: 3px solid rgba(255, 255, 255, 0.1); border-top: 3px solid #a855f7; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const IconShield = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconDelete = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="red" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const IconDownload = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>;

        const App = () => {
            const [user, setUser] = useState(null);
            const [step, setStep] = useState('register'); // register, login, verify, dashboard
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [files, setFiles] = useState([]);
            const [form, setForm] = useState({ name: '', email: '', password: '', confirmPassword: '', code: '' });
            const [genCode, setGenCode] = useState('');
            const fileRef = useRef();

            // Следим за авторизацией
            useEffect(() => {
                const unsubscribe = window.fb.methods.onAuthStateChanged(window.fb.auth, (u) => {
                    if (u) {
                        setUser(u);
                        setStep('dashboard');
                        loadFiles(u.uid);
                    } else {
                        setUser(null);
                        setStep('register');
                    }
                });
                return unsubscribe;
            }, []);

            const loadFiles = (uid) => {
                const q = window.fb.methods.collection(window.fb.db, "users", uid, "files");
                window.fb.methods.onSnapshot(q, (snapshot) => {
                    setFiles(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
            };

            const handleRegisterRequest = async (e) => {
                e.preventDefault();
                if (form.password !== form.confirmPassword) return setError("Пароли не совпадают!");
                if (!form.email.endsWith('@gmail.com')) return setError("Только @gmail.com");
                
                setLoading(true);
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                setGenCode(code);
                
                try {
                    await emailjs.send("service_9uyjyfk", "template_kk9muod", {
                        to_name: form.name,
                        email: form.email,
                        code: code
                    });
                    setStep('verify');
                } catch { setError("Ошибка EmailJS"); }
                setLoading(false);
            };

            const completeRegistration = async () => {
                if (form.code !== genCode) return setError("Неверный код!");
                setLoading(true);
                try {
                    const res = await window.fb.methods.createUserWithEmailAndPassword(window.fb.auth, form.email, form.password);
                    await window.fb.methods.setDoc(window.fb.methods.doc(window.fb.db, "users", res.user.uid), { name: form.name });
                } catch (e) { setError("Ошибка регистрации: " + e.message); }
                setLoading(false);
            };

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !user) return;
                setLoading(true);
                try {
                    const storageRef = window.fb.methods.ref(window.fb.storage, `files/${user.uid}/${file.name}`);
                    await window.fb.methods.uploadBytes(storageRef, file);
                    const url = await window.fb.methods.getDownloadURL(storageRef);
                    
                    await window.fb.methods.addDoc(window.fb.methods.collection(window.fb.db, "users", user.uid, "files"), {
                        name: file.name,
                        url: url,
                        size: (file.size / 1024).toFixed(1) + " KB",
                        date: new Date().toLocaleDateString()
                    });
                } catch (e) { alert("Ошибка загрузки"); }
                setLoading(false);
            };

            const deleteFile = async (f) => {
                if (!confirm("Удалить файл?")) return;
                try {
                    await window.fb.methods.deleteDoc(window.fb.methods.doc(window.fb.db, "users", user.uid, "files", f.id));
                    const sRef = window.fb.methods.ref(window.fb.storage, `files/${user.uid}/${f.name}`);
                    await window.fb.methods.deleteObject(sRef);
                } catch (e) { console.log(e); }
            };

            if (step === 'dashboard') {
                return (
                    <div className="min-h-screen p-6 fade-in">
                        <div className="max-w-6xl mx-auto flex justify-between items-center mb-10">
                            <div className="text-purple-500 font-bold text-2xl flex items-center gap-2"><IconShield /> EverScript</div>
                            <button onClick={() => window.fb.methods.signOut(window.fb.auth)} className="text-xs opacity-50 hover:opacity-100">Выход</button>
                        </div>

                        <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
                            <div className="space-y-4">
                                <div className="glass p-6 rounded-2xl">
                                    <p className="text-slate-500 text-xs font-bold mb-1 tracking-widest uppercase">Хранилище</p>
                                    <p className="text-2xl font-bold">{files.length} объектов</p>
                                </div>
                                <button onClick={() => fileRef.current.click()} className="w-full bg-purple-600 py-4 rounded-2xl font-bold hover:bg-purple-500 transition-all">
                                    {loading ? "Загрузка..." : "Добавить файл"}
                                </button>
                                <input type="file" className="hidden" ref={fileRef} onChange={handleUpload} />
                            </div>

                            <div className="lg:col-span-3 glass rounded-3xl p-6">
                                <h2 className="text-xl font-bold mb-6">Ваши данные</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {files.map(f => (
                                        <div key={f.id} className="file-card p-4 rounded-xl flex items-center justify-between">
                                            <div className="flex items-center gap-3 truncate">
                                                <div className="w-10 h-10 bg-white/5 rounded flex items-center justify-center">📄</div>
                                                <div className="truncate">
                                                    <p className="font-medium text-sm truncate">{f.name}</p>
                                                    <p className="text-[10px] text-slate-500">{f.size}</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <a href={f.url} target="_blank" className="p-2 hover:bg-white/10 rounded"><IconDownload /></a>
                                                <button onClick={() => deleteFile(f)} className="p-2 hover:bg-red-500/10 rounded"><IconDelete /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass w-full max-w-md p-8 rounded-3xl">
                        <h1 className="text-center font-bold text-2xl mb-8 tracking-tighter">EVERSCRIPT</h1>
                        {error && <p className="text-red-400 text-xs mb-4 text-center">{error}</p>}

                        {step === 'register' ? (
                            <form onSubmit={handleRegisterRequest} className="space-y-4">
                                <input placeholder="Имя" onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none" required />
                                <input placeholder="Email (@gmail.com)" onChange={e => setForm({...form, email: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none" required />
                                <input type="password" placeholder="Пароль" onChange={e => setForm({...form, password: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none" required />
                                <input type="password" placeholder="Повторите пароль" onChange={e => setForm({...form, confirmPassword: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none" required />
                                <button className="w-full bg-purple-600 p-4 rounded-xl font-bold">{loading ? "..." : "Зарегистрироваться"}</button>
                                <p onClick={() => setStep('login')} className="text-center text-xs opacity-50 cursor-pointer">Вход</p>
                            </form>
                        ) : step === 'login' ? (
                            <form onSubmit={async (e) => { e.preventDefault(); setLoading(true); try { await window.fb.methods.signInWithEmailAndPassword(window.fb.auth, form.email, form.password); } catch { setError("Ошибка входа"); } setLoading(false); }} className="space-y-4">
                                <input placeholder="Email" onChange={e => setForm({...form, email: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none" />
                                <input type="password" placeholder="Пароль" onChange={e => setForm({...form, password: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none" />
                                <button className="w-full bg-purple-600 p-4 rounded-xl font-bold">Войти</button>
                                <p onClick={() => setStep('register')} className="text-center text-xs opacity-50 cursor-pointer">Нет аккаунта?</p>
                            </form>
                        ) : (
                            <div className="text-center space-y-4">
                                <p className="text-sm opacity-70">Введите код из письма</p>
                                <input placeholder="000000" onChange={e => setForm({...form, code: e.target.value})} className="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-2xl tracking-[0.5em]" />
                                <button onClick={completeRegistration} className="w-full bg-purple-600 p-4 rounded-xl font-bold">Подтвердить</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
